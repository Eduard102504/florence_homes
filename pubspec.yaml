name: florence_homes
description: Florence Homes Village Gate System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # NFC & Bluetooth & USB
  nfc_manager: ^3.4.0  # Use this specific version
  flutter_blue_plus: ^1.32.0
  usb_serial: ^0.5.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0

  # UI & State Management
  provider: ^6.1.1
  intl: ^0.18.1
  shared_preferences: ^2.2.2

  # File & Share
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  permission_handler: ^11.0.1

  # CSV & Network
  csv: ^5.1.1
  http: ^1.1.0
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true